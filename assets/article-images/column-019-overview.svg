<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title-19 desc-19">
<title id="title-19">【検定・中級】知っていると自慢できる？神社の名称クイズの図解</title>
<desc id="desc-19">紙・鈴緒・鰹木を読む。紙垂、鈴緒、鰹木を視覚的に示す独自図解。</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Zen+Old+Mincho:wght@600;700&amp;display=swap');</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#262c34" flood-opacity="0.16"/></filter></defs>
<rect width="1200" height="720" fill="#fbfaf4"/>
<rect x="250" y="260" width="200" height="140" rx="20" fill="#e5e9e7" stroke="#262c34" stroke-width="5"/><text x="350" y="342" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="31" font-weight="700" fill="#262c34">紙垂</text><rect x="500" y="260" width="200" height="140" rx="20" fill="#e5e9e7" stroke="#262c34" stroke-width="5"/><text x="600" y="342" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="31" font-weight="700" fill="#262c34">鈴緒</text><rect x="750" y="260" width="200" height="140" rx="20" fill="#e5e9e7" stroke="#262c34" stroke-width="5"/><text x="850" y="342" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="31" font-weight="700" fill="#262c34">鰹木</text><text x="600" y="510" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="31" font-weight="700" fill="#a44131">ことばを知ると、境内が読める</text><text x="600" y="650" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="30" font-weight="700" fill="#262c34">紙・鈴緒・鰹木を読む</text>
<g transform="translate(72 76)"><rect width="169" height="46" rx="23" fill="#fffdf8" stroke="#262c34" stroke-width="2"/><circle cx="23" cy="23" r="7" fill="#262c34"/><text x="42" y="30" text-anchor="start" font-family="'Zen Kaku Gothic New','Noto Sans CJK JP',sans-serif" font-size="18" font-weight="700" fill="#262c34">神社の名称</text></g>
<text x="1128" y="664" text-anchor="end" font-family="'Zen Kaku Gothic New','Noto Sans CJK JP',sans-serif" font-size="16" letter-spacing="2" fill="#262c34" opacity="0.65">TENMEI MORI · KAMIKUJI SOSHI</text>
</svg>