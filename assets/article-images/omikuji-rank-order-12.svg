      <text x="146" y="41" class="fortune" fill="#782b33">半凶</text>
      <text x="278" y="38" class="reading">はんきょう</text>
      <rect x="698" y="17" width="112" height="30" rx="15" fill="#9a363c"/>
      <text x="754" y="38" text-anchor="middle" fill="#fffdf7" class="state">転じる余地</text>
