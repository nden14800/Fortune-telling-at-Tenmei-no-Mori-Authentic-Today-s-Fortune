      <rect width="100" height="64" rx="8" fill="#8c303b"/>
      <text x="50" y="40" text-anchor="middle" fill="#fffdf7" class="rank">11</text>
      <text x="146" y="41" class="fortune" fill="#6e2530">末凶</text>
      <text x="278" y="38" class="reading">すえきょう</text>
      <rect x="698" y="17" width="112" height="30" rx="15" fill="#8c303b"/>
      <text x="754" y="38" text-anchor="middle" fill="#fffdf7" class="state">次へ備える</text>
    </g>
    <g transform="translate(255 1037)">
      <rect width="842" height="64" rx="8" fill="#f0dfe2" stroke="#8a4352" stroke-width="2"/>
      <rect width="100" height="64" rx="8" fill="#74293a"/>
      <text x="50" y="40" text-anchor="middle" fill="#fffdf7" class="rank">12</text>
      <text x="146" y="41" class="fortune" fill="#5d2031">大凶</text>
      <text x="278" y="38" class="reading">だいきょう</text>
      <rect x="698" y="17" width="112" height="30" rx="15" fill="#74293a"/>
      <text x="754" y="38" text-anchor="middle" fill="#fffdf7" class="state">言葉を受け取る</text>
    </g>
