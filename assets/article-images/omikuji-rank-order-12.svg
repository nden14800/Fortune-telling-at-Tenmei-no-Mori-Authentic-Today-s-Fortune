<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320" role="img" aria-labelledby="title desc">
  <title id="title">天命乃杜のおみくじ：12段階の吉凶の目安</title>
  <desc id="desc">大吉から大凶まで、天命乃杜で採用する12段階の順番を上から順に示した図。神社やお寺によって順番や扱いが異なる旨も注記している。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#f5efe1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9b65d"/>
      <stop offset="0.5" stop-color="#a77d22"/>
      <stop offset="1" stop-color="#dfc878"/>
    </linearGradient>
    <pattern id="asanoha" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <path d="M14 0 28 7v14l-14 7L0 21V7Z M14 7v14 M7 10.5l14 7 M21 10.5l-14 7" fill="none" stroke="#b58b37" stroke-width="0.8" opacity="0.25"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4d3218" flood-opacity="0.12"/>
    </filter>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&amp;family=Zen+Old+Mincho:wght@700&amp;display=swap');
      .title { font-family: 'Zen Old Mincho', 'Noto Serif JP', 'Noto Sans CJK JP', serif; fill: #3b2817; font-weight: 700; }
      .sans { font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif; fill: #493a2c; }
      .rank { font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.08em; }
      .fortune { font-family: 'Zen Old Mincho', 'Noto Serif JP', 'Noto Sans CJK JP', serif; font-weight: 700; font-size: 33px; }
      .reading { font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif; font-size: 16px; letter-spacing: 0.12em; }
      .state { font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', 'Noto Sans CJK JP', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.06em; }
    </style>
  </defs>

  <rect width="1200" height="1320" fill="#f4efe3"/>
  <rect x="32" y="32" width="1136" height="1256" rx="12" fill="url(#paper)" stroke="url(#gold)" stroke-width="3"/>
  <rect x="51" y="51" width="1098" height="1218" rx="5" fill="none" stroke="#cdb274" stroke-width="1.5"/>
  <rect x="52" y="52" width="1096" height="174" rx="5" fill="url(#asanoha)"/>

  <g transform="translate(600 78)">
    <path d="M-24 0h48M0-24v48M-17-17 17 17M17-17-17 17" stroke="#b4862b" stroke-width="2" opacity="0.75"/>
    <circle r="8" fill="#b4862b"/>
  </g>
  <text x="600" y="134" text-anchor="middle" class="title" font-size="44" letter-spacing="0.12em">おみくじの順番</text>
  <text x="600" y="177" text-anchor="middle" class="sans" font-size="20" letter-spacing="0.10em">天命乃杜で採用する　12段階の吉凶の目安</text>

  <g transform="translate(98 267)">
    <rect width="120" height="848" rx="60" fill="#f0e8d6" stroke="#d6bb76" stroke-width="1.5"/>
    <path d="M60 74V776" stroke="#b98e35" stroke-width="3" stroke-dasharray="4 7"/>
    <path d="M60 36 42 74h36Z" fill="#a67a25"/>
    <path d="M60 812 42 774h36Z" fill="#9c4834"/>
