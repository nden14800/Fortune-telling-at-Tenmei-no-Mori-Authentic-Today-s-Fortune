  <g transform="translate(98 1163)">
    <rect width="1004" height="67" rx="8" fill="#f1eadb" stroke="#cbb47b" stroke-width="1.5"/>
    <circle cx="36" cy="33.5" r="14" fill="#a77727"/>
    <text x="36" y="39" text-anchor="middle" fill="#fffdf7" font-family="serif" font-size="21" font-weight="700">注</text>
    <text x="66" y="29" class="sans" font-size="17" font-weight="700">順位・名称・扱いは、神社やお寺によって異なることがあります。</text>
    <text x="66" y="51" class="sans" font-size="15">吉凶だけで決めず、おみくじに書かれた和歌や助言を、今の自分への言葉として読みましょう。</text>
