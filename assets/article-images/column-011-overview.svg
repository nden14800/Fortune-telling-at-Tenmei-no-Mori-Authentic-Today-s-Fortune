<title id="title-11">鳥居の向こう側 — 神域と俗界を分ける境界線の図解</title>
<desc id="desc-11">二つの形式で、境界を知る。神明、明神、結界を視覚的に示す独自図解。</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Zen+Old+Mincho:wght@600;700&amp;display=swap');</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#8d3028" flood-opacity="0.16"/></filter></defs>
<rect width="1200" height="720" fill="#fff9ef"/>
<path d="M190 530V275M435 530V275M150 275h325" stroke="#8d3028" stroke-width="22" fill="none"/><path d="M190 248h245" stroke="#5b3922" stroke-width="14"/><path d="M765 530V275M1010 530V275M725 275h325" stroke="#8d3028" stroke-width="22" fill="none"/><path d="M725 250q162-45 325 0" stroke="#5b3922" stroke-width="16" fill="none"/><text x="312" y="600" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="30" font-weight="700" fill="#8d3028">神明</text><text x="888" y="600" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="30" font-weight="700" fill="#8d3028">明神</text><text x="600" y="660" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="30" font-weight="700" fill="#8d3028">二つの形式で、境界を知る</text>
<g transform="translate(72 76)"><rect width="150" height="46" rx="23" fill="#fffdf8" stroke="#8d3028" stroke-width="2"/><circle cx="23" cy="23" r="7" fill="#8d3028"/><text x="42" y="30" text-anchor="start" font-family="'Zen Kaku Gothic New','Noto Sans CJK JP',sans-serif" font-size="18" font-weight="700" fill="#8d3028">鳥居</text></g>
