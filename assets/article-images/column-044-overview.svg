<rect width="1200" height="720" fill="#fbfaf4"/>
<rect x="290" y="150" width="620" height="430" fill="#fffdf8" stroke="#262c34" stroke-width="8"/><path d="M600 150v430M290 365h620" stroke="#262c34" stroke-width="5"/><circle cx="340" cy="200" r="31" fill="#a44131" opacity="1"/><text x="340" y="208" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="19" font-weight="700" fill="#fff">北東</text><circle cx="860" cy="200" r="31" fill="#a44131" opacity="1"/><text x="860" y="208" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="19" font-weight="700" fill="#fff">北西</text><circle cx="340" cy="530" r="31" fill="#a44131" opacity="1"/><text x="340" y="538" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="19" font-weight="700" fill="#fff">南東</text><circle cx="860" cy="530" r="31" fill="#a44131" opacity="1"/><text x="860" y="538" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="19" font-weight="700" fill="#fff">南西</text><path d="M600 260v190M505 355h190" stroke="#a44131" stroke-width="5" stroke-dasharray="7 10"/><text x="600" y="650" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="30" font-weight="700" fill="#262c34">部屋の境界に、風を通す</text>
<g transform="translate(72 76)"><rect width="169" height="46" rx="23" fill="#fffdf8" stroke="#262c34" stroke-width="2"/><circle cx="23" cy="23" r="7" fill="#262c34"/><text x="42" y="30" text-anchor="start" font-family="'Zen Kaku Gothic New','Noto Sans CJK JP',sans-serif" font-size="18" font-weight="700" fill="#262c34">四隅の掃除</text></g>
