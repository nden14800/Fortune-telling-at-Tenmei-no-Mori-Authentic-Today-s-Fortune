<title id="title-44">【風水】部屋の「四隅」を掃除せよ。神様は隅（すみ）に宿る？の図解</title>
<desc id="desc-44">部屋の境界に、風を通す。北東、北西、南東、南西を視覚的に示す独自図解。</desc>
