<title id="title-15">拝殿の鏡が映し出すもの —「かがみ」から「が」を取ると？の図解</title>
<desc id="desc-15">「が」を取れば、神が映る。鏡、我、神を視覚的に示す独自図解。</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Zen+Old+Mincho:wght@600;700&amp;display=swap');</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#293046" flood-opacity="0.16"/></filter></defs>
<rect width="1200" height="720" fill="#f8f4ea"/>
<ellipse cx="600" cy="340" rx="180" ry="220" fill="#dce3f0" stroke="#293046" stroke-width="8"/><ellipse cx="600" cy="340" rx="135" ry="174" fill="#fffdf8" stroke="#ca9853" stroke-width="5"/><path d="M600 205v240M510 325h180" stroke="#293046" stroke-width="4" opacity="0.5"/><text x="600" y="355" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="72" font-weight="700" fill="#293046">神</text><text x="600" y="650" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="30" font-weight="700" fill="#293046">「が」を取れば、神が映る</text>
<g transform="translate(72 76)"><rect width="150" height="46" rx="23" fill="#fffdf8" stroke="#293046" stroke-width="2"/><circle cx="23" cy="23" r="7" fill="#293046"/><text x="42" y="30" text-anchor="start" font-family="'Zen Kaku Gothic New','Noto Sans CJK JP',sans-serif" font-size="18" font-weight="700" fill="#293046">かがみ</text></g>
<text x="1128" y="664" text-anchor="end" font-family="'Zen Kaku Gothic New','Noto Sans CJK JP',sans-serif" font-size="16" letter-spacing="2" fill="#293046" opacity="0.65">TENMEI MORI · KAMIKUJI SOSHI</text>
</svg>