<title id="title-54">【豆知識】神社の「狛犬」、向かって右が口を開けている——阿吽の秘密と、実は「獅子と狛犬の異種コンビ」だった話の図解</title>
<desc id="desc-54">異なる二体で、入口を守る。阿、吽、獅子と狛犬を視覚的に示す独自図解。</desc>
