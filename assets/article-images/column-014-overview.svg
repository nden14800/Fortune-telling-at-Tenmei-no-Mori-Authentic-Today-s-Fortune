<title id="title-14">なぜ神社の鳥居や社殿は「赤（朱色）」なのか？の図解</title>
<desc id="desc-14">防腐と魔除け、二つの理由。水銀、防腐、生命を視覚的に示す独自図解。</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Zen+Old+Mincho:wght@600;700&amp;display=swap');</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#8d3028" flood-opacity="0.16"/></filter></defs>
<rect width="1200" height="720" fill="#fff9ef"/>
<rect x="185" y="180" width="830" height="330" rx="24" fill="#5b3922"/><path d="M185 280h830M185 390h830" stroke="#fffdf8" stroke-width="9" opacity="0.85"/><text x="600" y="355" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="112" font-weight="700" fill="#fff">朱</text><text x="390" y="575" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="31" font-weight="700" fill="#8d3028">防腐</text><text x="810" y="575" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="31" font-weight="700" fill="#8d3028">魔除け</text><text x="600" y="650" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="30" font-weight="700" fill="#8d3028">防腐と魔除け、二つの理由</text>
<g transform="translate(72 76)"><rect width="150" height="46" rx="23" fill="#fffdf8" stroke="#8d3028" stroke-width="2"/><circle cx="23" cy="23" r="7" fill="#8d3028"/><text x="42" y="30" text-anchor="start" font-family="'Zen Kaku Gothic New','Noto Sans CJK JP',sans-serif" font-size="18" font-weight="700" fill="#8d3028">朱色</text></g>
<text x="1128" y="664" text-anchor="end" font-family="'Zen Kaku Gothic New','Noto Sans CJK JP',sans-serif" font-size="16" letter-spacing="2" fill="#8d3028" opacity="0.65">TENMEI MORI · KAMIKUJI SOSHI</text>
