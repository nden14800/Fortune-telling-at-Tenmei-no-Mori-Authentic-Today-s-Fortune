<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title-5 desc-5">
<title id="title-5">「待ち人」は恋愛だけじゃないの図解</title>
<desc id="desc-5">人生を結ぶ、まだ見ぬ縁。人、縁、時を待つを視覚的に示す独自図解。</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&amp;family=Zen+Old+Mincho:wght@600;700&amp;display=swap');</style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#7d3851" flood-opacity="0.16"/></filter></defs>
<rect width="1200" height="720" fill="#fff9f5"/>
<path d="M175 430C335 215 485 585 600 350S850 170 1030 420" stroke="#50613d" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M175 455C335 240 485 610 600 375S850 195 1030 445" stroke="#7d3851" stroke-width="3" fill="none" opacity="0.7"/><circle cx="250" cy="340" r="36" fill="#f3dde5" opacity="1"/><circle cx="950" cy="350" r="36" fill="#f3dde5" opacity="1"/><text x="250" y="350" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="20" font-weight="700" fill="#7d3851">今</text><text x="950" y="360" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="20" font-weight="700" fill="#7d3851">縁</text><text x="600" y="650" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="30" font-weight="700" fill="#7d3851">人生を結ぶ、まだ見ぬ縁</text>
<g transform="translate(72 76)"><rect width="150" height="46" rx="23" fill="#fffdf8" stroke="#7d3851" stroke-width="2"/><circle cx="23" cy="23" r="7" fill="#7d3851"/><text x="42" y="30" text-anchor="start" font-family="'Zen Kaku Gothic New','Noto Sans CJK JP',sans-serif" font-size="18" font-weight="700" fill="#7d3851">待ち人</text></g>
<text x="1128" y="664" text-anchor="end" font-family="'Zen Kaku Gothic New','Noto Sans CJK JP',sans-serif" font-size="16" letter-spacing="2" fill="#7d3851" opacity="0.65">TENMEI MORI · KAMIKUJI SOSHI</text>
</svg>