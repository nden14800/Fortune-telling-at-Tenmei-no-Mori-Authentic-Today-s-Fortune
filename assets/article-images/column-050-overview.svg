<title id="title-50">【建築】手水舎（ちょうずや）の構造——「水で清める」のは、神話の時代から続く禊の形の図解</title>
<desc id="desc-50">水で整える、禊の入口。屋根、水盤、柄杓を視覚的に示す独自図解。</desc>
