<circle cx="260" cy="340" r="82" fill="#dceef2" opacity="1"/><text x="260" y="352" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="32" font-weight="700" fill="#24586c">鳥居</text><path d="M345 340L495 340" stroke="#24586c" stroke-width="6"  stroke-linecap="round" fill="none"/><circle cx="600" cy="340" r="82" fill="#c66b41" opacity="1"/><text x="600" y="352" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="32" font-weight="700" fill="#fff">手水</text><path d="M685 340L835 340" stroke="#24586c" stroke-width="6"  stroke-linecap="round" fill="none"/><circle cx="940" cy="340" r="82" fill="#dceef2" opacity="1"/><text x="940" y="352" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="32" font-weight="700" fill="#24586c">拝礼</text><text x="600" y="540" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="38" font-weight="700" fill="#c66b41">二礼　二拍手　一礼</text><text x="600" y="650" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="30" font-weight="700" fill="#24586c">鳥居・手水・拝礼の三歩</text>
