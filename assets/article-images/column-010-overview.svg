<rect width="1200" height="720" fill="#fbfaf0"/>
<path d="M260 450q75-210 150 0Z" fill="#fffdf8" stroke="#41593b" stroke-width="5"/><text x="335" y="420" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="56" font-weight="700" fill="#41593b">狐</text><path d="M525 450q75-210 150 0Z" fill="#e3eed7" stroke="#41593b" stroke-width="5"/><text x="600" y="420" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="56" font-weight="700" fill="#41593b">牛</text><path d="M790 450q75-210 150 0Z" fill="#fffdf8" stroke="#41593b" stroke-width="5"/><text x="865" y="420" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="56" font-weight="700" fill="#b06438">鹿</text><text x="600" y="650" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="30" font-weight="700" fill="#41593b">狐・牛・鹿が語る神の使い</text>
<g transform="translate(72 76)"><rect width="150" height="46" rx="23" fill="#fffdf8" stroke="#41593b" stroke-width="2"/><circle cx="23" cy="23" r="7" fill="#41593b"/><text x="42" y="30" text-anchor="start" font-family="'Zen Kaku Gothic New','Noto Sans CJK JP',sans-serif" font-size="18" font-weight="700" fill="#41593b">神使</text></g>
