<rect width="1200" height="720" fill="#fbfaf4"/>
<g transform="translate(330 340)"><rect x="-45" y="-135" width="90" height="270" rx="8" fill="#e5e9e7" stroke="#262c34" stroke-width="5"/><text x="0" y="10" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="33" font-weight="700" fill="#262c34">笏</text></g><g transform="translate(600 340)"><rect x="-45" y="-135" width="90" height="270" rx="45" fill="#a44131" stroke="#262c34" stroke-width="5"/><text x="0" y="10" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="24" font-weight="700" fill="#fff">御神酒</text></g><g transform="translate(870 340)"><rect x="-45" y="-135" width="90" height="270" rx="8" fill="#e5e9e7" stroke="#262c34" stroke-width="5"/><text x="0" y="10" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="33" font-weight="700" fill="#262c34">祝詞</text></g><text x="600" y="650" text-anchor="middle" font-family="'Zen Old Mincho','Shippori Mincho','Noto Serif CJK JP',serif" font-size="30" font-weight="700" fill="#262c34">笏・御神酒・祝詞を読む</text>
<g transform="translate(72 76)"><rect width="169" height="46" rx="23" fill="#fffdf8" stroke="#262c34" stroke-width="2"/><circle cx="23" cy="23" r="7" fill="#262c34"/><text x="42" y="30" text-anchor="start" font-family="'Zen Kaku Gothic New','Noto Sans CJK JP',sans-serif" font-size="18" font-weight="700" fill="#262c34">神職の言葉</text></g>
